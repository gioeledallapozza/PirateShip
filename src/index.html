<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Pirate Ship | Dalla Pozza Gioele Portfolio </title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header class="main-header">
      <nav>
        <div class="logo">Gioele Dalla Pozza</div>
        <ul class="nav-links">
            <li><a href="#projects">Work</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="mailto:dpgioele@gmail.com">Contact</a></li>
        </ul>
      </nav>
    </header>
    
    <canvas class="webgl"></canvas>

    /* Hitpoints UI  HIDDEN BY DEFAULT */
    <div class="hotpointsContainer"></div>
    <div id="project-modal" class="hidden">
        <button class="close-btn" aria-label="Chiudi">&times;</button>
        <div class="modal-content">
            <span class="modal-category">Ship's Log</span>
            <h2 class="project-title">Titolo</h2>
            
            <div class="modal-body">
                <p class="project-description">Testo principale...</p>
            </div>

            </div>
        </div>

    /* Main UI Standard website */
    <main id="ui-wrapper">
        <section class="section hero">
            <div class="content">
                <h1>Gioele <br> Dalla Pozza</h1>
                <p>A journey through code and interactive work</p>

    <script type="module" src="/main.js"></script>
